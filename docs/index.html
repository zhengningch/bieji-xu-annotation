<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>別集序 vs 墓誌銘</title><style>body{max-width:1350px;margin:auto;padding:20px;font:18px/1.8 serif}.p{background:#ffd4d4}.s{background:#dceaff}.item{border:1px solid #ccd3dc;border-radius:8px;padding:16px;margin:18px 0}.tag{font:12px sans-serif;background:#eee;padding:3px 5px;border-radius:4px}.region{border-left:5px solid #888;padding-left:8px;margin:9px 0}.region.議論{border-color:#8c6bb1}.region.敘事{border-color:#4c9c72}.region.抒情{border-color:#c57d40}.region.說明{border-color:#5c8bc2}.chart{display:inline-block;width:230px;border:1px solid #ddd;margin:5px;padding:8px}.bar{height:16px;background:#b9555e;display:inline-block}select{margin:5px;padding:5px}.note{background:#f5f7fa;padding:12px}</style><h1>別集序 vs 同作者墓誌銘</h1><p>DS 逐句標註。<span class=p>紅＝駢</span>；<span class=s>藍＝散</span>。區段色線：紫＝議論、綠＝敘事（人物傳記）、橙＝抒情、藍＝說明。</p><h2>按時代／文類</h2><div id=charts></div><h2>同作者比較</h2><div id=compare></div><h2>逐句可視化</h2><div class=note>文類 <select id=g></select> 時代 <select id=p></select> 作者 <select id=a></select></div><main id=r></main><h2>所有參考</h2><ol id=refs></ol><script>const $=x=>document.querySelector(x);fetch('data.json').then(r=>r.json()).then(D=>{let A=D.articles;function op(id,x){$(id).innerHTML='<option value="">全部</option>'+[...new Set(x)].sort().map(y=>'<option>'+y+'</option>').join('')}op('#g',A.map(x=>x.genre));op('#p',A.map(x=>x.序作者分期));op('#a',A.map(x=>x.序作者));$('#charts').innerHTML=D.periods.map(x=>`<div class=chart><b>${x.時代}／${x.文類}</b><br>${x.篇數||''} ${x.句數}句，${x.字數}字<br>駢句率 ${(x.駢句率*100).toFixed(1)}%<br><i class=bar style="width:${x.駢句率*100}%"></i></div>`).join('');$('#compare').innerHTML=D.comparisons.map(x=>`<div class=chart><b>${x.作者}／${x.時代}</b><br>別集 ${(x.別集序駢句率*100).toFixed(1)}%<br>墓誌 ${(x.墓誌銘駢句率*100).toFixed(1)}%<br>差 ${(x.差值_墓誌銘減別集序*100).toFixed(1)}%</div>`).join('');$('#refs').innerHTML=A.map(x=>`<li><a href="${x.來源}" target=_blank>${x.genre}｜${x.標題}</a>（${x.序作者}，${x.卷}）</li>`).join('');function go(){let q=['#g','#p','#a'].map(x=>$(x).value);$('#r').innerHTML=A.filter(x=>(!q[0]||x.genre==q[0])&&(!q[1]||x.序作者分期==q[1])&&(!q[2]||x.序作者==q[2])).map(x=>{let gs=[];x.sentences.forEach(s=>{let z=gs.at(-1);if(!z||z.t!=s.content_type)gs.push({t:s.content_type,x:[s]});else z.x.push(s)});return `<article class=item><h3>${x.genre}｜${x.標題}</h3><small>${x.序作者}／${x.序作者分期}　<a href="${x.來源}">來源</a></small>${gs.map(z=>`<div class="region ${z.t.split('（')[0].split('/')[0]}"><span class=tag>${z.t}</span>${z.x.map(s=>`<span class=${s.bian_san=='駢'?'p':'s'} title="第${s.id+1}句">${s.text}</span>`).join('')}</div>`).join('')}</article>`}).join('')}document.querySelectorAll('select').forEach(x=>x.onchange=go);go()})</script>
